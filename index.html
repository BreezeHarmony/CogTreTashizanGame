<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>たしざん けいさんゲーム</title>
<style>
  :root{
    --bg: #eefaf9;
    --accent: #2f8fa1;
    --accent-dark: #1f6675;
    --good: #3cb371;
    --good-dark: #2b8a5a;
    --card-bg: #ffffff;
    --card-border: #eee;
    --text: #2b2b2b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overscroll-behavior: none;
    overflow: hidden;
  }
  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(20px, 3.2vw, 30px);
    margin: 4px 0 2px;
    text-align: center;
    flex-shrink: 0;
  }
  .subtitle {
    font-size: clamp(13px, 2vw, 16px);
    color: #666;
    margin-bottom: 8px;
    text-align: center;
    flex-shrink: 0;
  }

  /* --- スタート画面 --- */
  #start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: 16px;
  }
  .big-icon {
    font-size: 64px;
    animation: bounce 2.4s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }
  .diff-buttons {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .diff-btn {
    font-size: 22px;
    padding: 22px 30px;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--accent-dark);
    min-width: 170px;
    font-weight: bold;
    transition: transform .08s;
  }
  .diff-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 var(--accent-dark);
  }
  .diff-btn small {
    display: block;
    font-size: 14px;
    font-weight: normal;
    margin-top: 6px;
    opacity: .9;
  }
  .diff-btn.lv1 { background: #6fa8dc; box-shadow: 0 6px 0 #4c7fb0; }
  .diff-btn.lv2 { background: var(--accent); box-shadow: 0 6px 0 var(--accent-dark); }
  .diff-btn.lv3 { background: #d3542e; box-shadow: 0 6px 0 #a83e1f; }

  /* --- ゲーム画面 --- */
  #game-screen {
    display: none;
    width: 100%;
    max-width: 1000px;
    height: 100%;
    min-height: 0;
    flex-direction: column;
    align-items: center;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 8px;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .status {
    font-size: clamp(14px, 2.2vw, 18px);
    background: white;
    border-radius: 16px;
    padding: 8px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .icon-btn {
    font-size: 17px;
    border: none;
    background: white;
    border-radius: 16px;
    padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .icon-btn:active { transform: scale(0.95); }

  /* --- もんだい表示 --- */
  #prompt-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: white;
    border-radius: 22px;
    padding: 14px 20px;
    margin-bottom: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.1);
    flex-shrink: 0;
    min-height: 90px;
    gap: 8px;
  }
  #icon-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: clamp(24px, 5vmin, 42px);
    line-height: 1;
  }
  #icon-row .plus-sign {
    font-size: clamp(20px, 4vmin, 34px);
    color: var(--accent-dark);
    font-weight: bold;
  }
  #equation-text {
    font-size: clamp(34px, 8vmin, 72px);
    font-weight: bold;
    letter-spacing: 2px;
    animation: popin .35s ease;
  }
  @keyframes popin {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* --- 選択肢 --- */
  #options {
    display: flex;
    gap: 14px;
    width: 100%;
    flex: 1;
    min-height: 0;
  }
  .option-btn {
    flex: 1;
    min-width: 0;
    position: relative;
    background: var(--card-bg);
    border: 4px solid var(--card-border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.08);
    transition: transform .12s, background .2s, border-color .2s;
    padding: 8px;
  }
  .option-btn:active { transform: scale(0.96); }
  .option-number {
    font-size: clamp(40px, 11vmin, 92px);
    font-weight: bold;
    line-height: 1;
  }
  .option-btn.correct {
    background: #eafff1;
    border-color: var(--good);
  }
  .option-btn.correct::after {
    content: "✓";
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: clamp(16px, 2.6vmin, 26px);
    color: var(--good-dark);
    font-weight: bold;
  }
  .option-btn.wrong {
    animation: shake .4s;
    opacity: .75;
  }
  .option-btn.dim { opacity: .55; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* --- フィードバック帯 --- */
  #feedback-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: white;
    border-radius: 22px;
    padding: 14px 20px;
    margin-top: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,.1);
    flex-shrink: 0;
    gap: 12px;
    flex-wrap: wrap;
  }
  #feedback-msg {
    font-size: clamp(18px, 3vmin, 26px);
    font-weight: bold;
  }
  .next-btn {
    font-size: 20px;
    padding: 14px 28px;
    border-radius: 18px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-dark);
    font-weight: bold;
    white-space: nowrap;
  }
  .next-btn:active { transform: translateY(5px); box-shadow: none; }

  /* --- けっか画面 --- */
  #result-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    text-align: center;
  }
  #result-screen .confetti { font-size: 52px; }
  #result-screen h2 { font-size: clamp(26px, 6vw, 40px); color: var(--accent-dark); margin: 0; }
  #result-screen .score { font-size: clamp(20px, 4vw, 28px); }
  .result-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .restart-btn {
    font-size: 20px;
    padding: 16px 30px;
    border-radius: 20px;
    border: none;
    background: var(--good);
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--good-dark);
    font-weight: bold;
  }
  .restart-btn:active { transform: translateY(6px); box-shadow: none; }
  .home-btn {
    font-size: 20px;
    padding: 16px 30px;
    border-radius: 20px;
    border: none;
    background: #888;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #5f5f5f;
    font-weight: bold;
  }
  .home-btn:active { transform: translateY(6px); box-shadow: none; }
</style>
</head>
<body>
<div id="app">
  <h1>🚗 たしざん けいさんゲーム ➕</h1>
  <div class="subtitle">こたえの すうじを タップしよう！</div>

  <div id="start-screen">
    <div class="big-icon">🔢</div>
    <div class="diff-buttons">
      <button class="diff-btn lv1" onclick="startGame('easy')">かんたん<small>★☆☆・1〜5の たしざん</small></button>
      <button class="diff-btn lv2" onclick="startGame('normal')">ふつう<small>★★☆・1〜9の たしざん</small></button>
      <button class="diff-btn lv3" onclick="startGame('hard')">むずかしい<small>★★★・くりあがり あり</small></button>
    </div>
  </div>

  <div id="game-screen">
    <div class="top-bar">
      <div class="status">もんだい <span id="q-num">1</span> / <span id="q-total">8</span></div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="sound-btn" onclick="toggleSound()">🔊 おと</button>
        <button class="icon-btn" onclick="goToStart()">🏠 もどる</button>
      </div>
    </div>

    <div id="prompt-bar">
      <div id="icon-row"></div>
      <div id="equation-text"></div>
    </div>

    <div id="options"></div>

    <div id="feedback-bar">
      <div id="feedback-msg"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">つぎへ →</button>
    </div>
  </div>

  <div id="result-screen">
    <div class="confetti">🎉🔢🎉</div>
    <h2 id="result-title">よくできました！</h2>
    <div class="score" id="result-score">8もん中 8もん せいかい！</div>
    <div class="result-buttons">
      <button class="restart-btn" onclick="restartSame()">もういちど おなじレベル</button>
      <button class="home-btn" onclick="goToStart()">🏠 レベルを えらぶ</button>
    </div>
  </div>
</div>

<script>
  // --- レベル設定 ---
  const CONFIG = {
    easy:   { count: 8, aMin: 1, aMax: 5, bMin: 1, bMax: 5, useIcons: true,  label: "かんたん" },
    normal: { count: 8, aMin: 1, aMax: 9, bMin: 1, bMax: 9, useIcons: false, label: "ふつう" },
    hard:   { count: 8, aMin: 5, aMax: 20, bMin: 1, bMax: 9, useIcons: false, label: "むずかしい" }
  };
  const CAR_ICON = "🚗";

  let currentLevel = 'easy';
  let qList = [];
  let qIndex = 0;
  let correctCount = 0;
  let answered = false;
  let soundOn = true;

  const iconRowEl = document.getElementById('icon-row');
  const equationTextEl = document.getElementById('equation-text');
  const optionsEl = document.getElementById('options');
  const feedbackBar = document.getElementById('feedback-bar');
  const feedbackMsg = document.getElementById('feedback-msg');

  // --- 効果音（外部ファイル不要、その場で生成） ---
  let audioCtx = null;
  function playTone(freqs, duration = 0.15) {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let t = audioCtx.currentTime;
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, t + i * duration);
        gain.gain.linearRampToValueAtTime(0.15, t + i * duration + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + i * duration + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t + i * duration);
        osc.stop(t + i * duration + duration);
      });
    } catch (e) { /* 音が使えない環境では無視 */ }
  }
  function playCorrectSound() { playTone([523.25, 659.25, 783.99], 0.13); }
  function playTrySound() { playTone([300, 260], 0.12); }
  function playDoneSound() { playTone([523.25, 659.25, 783.99, 1046.5], 0.18); }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('sound-btn').textContent = soundOn ? "🔊 おと" : "🔇 おと";
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateOptions(correct) {
    const opts = new Set([correct]);
    let guard = 0;
    while (opts.size < 4 && guard < 100) {
      guard++;
      const offset = randInt(1, 5) * (Math.random() < 0.5 ? -1 : 1);
      const val = correct + offset;
      if (val >= 0) opts.add(val);
    }
    // 万一4つ集まらなかった場合の保険
    let filler = correct + 6;
    while (opts.size < 4) { opts.add(filler++); }
    return shuffle([...opts]).map(v => ({ value: v, correct: v === correct }));
  }

  function generateQuestions(level) {
    const cfg = CONFIG[level];
    const used = new Set();
    const qs = [];
    let guard = 0;
    while (qs.length < cfg.count && guard < 500) {
      guard++;
      const a = randInt(cfg.aMin, cfg.aMax);
      const b = randInt(cfg.bMin, cfg.bMax);
      const key = a + '+' + b;
      if (used.has(key)) continue;
      used.add(key);
      const correct = a + b;
      qs.push({ a, b, correct, options: generateOptions(correct), useIcons: cfg.useIcons });
    }
    return qs;
  }

  function startGame(level) {
    currentLevel = level;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.querySelector('h1').style.display = 'none';
    document.querySelector('.subtitle').style.display = 'none';

    qList = generateQuestions(level);
    qIndex = 0;
    correctCount = 0;
    document.getElementById('q-total').textContent = qList.length;
    renderQuestion();
  }

  function restartSame() {
    startGame(currentLevel);
  }

  function renderQuestion() {
    answered = false;
    feedbackBar.style.display = 'none';
    document.getElementById('q-num').textContent = qIndex + 1;

    const q = qList[qIndex];
    equationTextEl.textContent = `${q.a} + ${q.b} = ？`;
    equationTextEl.style.animation = 'none';
    void equationTextEl.offsetWidth;
    equationTextEl.style.animation = '';

    if (q.useIcons) {
      iconRowEl.style.display = 'flex';
      iconRowEl.innerHTML =
        CAR_ICON.repeat(q.a) +
        `<span class="plus-sign">➕</span>` +
        CAR_ICON.repeat(q.b);
    } else {
      iconRowEl.style.display = 'none';
      iconRowEl.innerHTML = '';
    }

    optionsEl.innerHTML = '';
    q.options.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'option-btn';
      btn._opt = opt;
      btn.innerHTML = `<div class="option-number">${opt.value}</div>`;
      btn.addEventListener('click', () => onAnswer(btn, opt));
      optionsEl.appendChild(btn);
    });
  }

  function onAnswer(btn, opt) {
    if (answered) return;
    answered = true;

    const allBtns = Array.from(optionsEl.children);
    if (opt.correct) {
      btn.classList.add('correct');
      allBtns.forEach(b => { if (b !== btn) b.classList.add('dim'); });
      correctCount++;
      playCorrectSound();
      feedbackMsg.textContent = "せいかい！ やったね！ 🎉";
    } else {
      btn.classList.add('wrong');
      allBtns.forEach(b => { if (b !== btn) b.classList.add('dim'); });
      const correctBtn = allBtns.find(b => b._opt.correct);
      if (correctBtn) {
        correctBtn.classList.remove('dim');
        correctBtn.classList.add('correct');
      }
      playTrySound();
      feedbackMsg.textContent = "おしい！ せいかいは これだよ ↓";
    }

    feedbackBar.style.display = 'flex';
    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = (qIndex === qList.length - 1) ? "けっかを みる →" : "つぎへ →";
  }

  function nextQuestion() {
    qIndex++;
    if (qIndex >= qList.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  function showResult() {
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'flex';
    document.querySelector('h1').style.display = '';
    document.querySelector('.subtitle').style.display = '';
    document.getElementById('result-score').textContent =
      `${CONFIG[currentLevel].label} ： ${qList.length}もん中 ${correctCount}もん せいかい！`;
    document.getElementById('result-title').textContent =
      correctCount === qList.length ? "パーフェクト！ すごい！" : "よくがんばりました！";
    playDoneSound();
  }

  function goToStart() {
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
    document.querySelector('h1').style.display = '';
    document.querySelector('.subtitle').style.display = '';
  }
</script>
</body>
</html>
